spring.application.name=trip-billing-service

# Postgres is started from compose.yaml by spring-boot-docker-compose on `./mvnw spring-boot:run`.
# Set spring.datasource.* (and spring.docker.compose.enabled=false) to point at an existing database instead.
spring.docker.compose.lifecycle-management=start-only

# Schema is owned by Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Responses are built inside the service's DB transaction; no lazy loading from controllers.
spring.jpa.open-in-view=false
# A list page loads child rows (lines, coupons, legs) in batches of up to 100, not one query per transaction.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
# Read every JSON decimal (including inside untyped metadata) as an exact BigDecimal, never a double.
spring.jackson.deserialization.use-big-decimal-for-floats=true

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
